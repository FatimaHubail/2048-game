<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
</head>
<body>
    <h1>2048 Game</h1>
    <div>
        <div class="stat-container">
            <div id = 'score'>Score: <span id="score-value">0</span></div>
            <div id="best-score">Best Score: <span id="best-value">0</span></div>
        </div>

        <div class="msg-area">

        </div>

        <div id="board"></div>
        <button id="new-game">New Game</button>
        <p>Use arrow keys to slide all tiles. Matching tiles merge into one. <br> 2048 to win!</p>
    </div>
</body>
</html>
